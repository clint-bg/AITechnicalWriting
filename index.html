<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<link rel="stylesheet" href="dist/theme/serif.css" id="theme">
		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-transition="convex">
					<h3>Examples and Student Perceptions in AI-Augmented Technical Writing</h3>
					<div style= "padding-top: 150px; font-size: 25px; text-align: right;">
						<p>
							<small>Content created and copyrighted by <a href="https://clint-bg.github.io/">Clint Guymon</a> in 2025 using <a href="https://revealjs.com/"> reveal.js </a> </small>
						</p>
						<img src="https://brightspotcdn.byu.edu/cc/50/c43ab7fd427aa058808f6c7bde2a/stretchy-athletics.svg" style="width: 100px; margin: 0 auto 4rem auto; background: transparent;" alt="byu logo" />
					</div>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
